}

}

/* Map */
iframe{
    width:100%;
    height:300px;
    border:0;

/* Message */

    font-weight:bold;
    margin-top:10px;

    <div class="box">
        <h2>✍️ तक्रार / सूचना नोंद</h2>

        <form id="complaintForm">
            <label>नाव</label>
            <input type="text" name="name" required>

            <label>मोबाईल नंबर</label>
            <input type="text" name="mobile" required>

            <label>तक्रारीचा विषय</label>
            <input type="text" name="subject" required>

            <label>तक्रार / सूचना</label>
            <textarea name="message" rows="4" required></textarea>

            <button type="submit">तक्रार सबमिट करा</button>
        </form>

        <div id="msg"></div>
    </div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbws6UWJkiUqnBAMdAlot5VyHbtrisSdrAud_52zNWHvhhD9YiX6BbJZ5llBBjbxyJl_/exec";

document.getElementById("complaintForm").addEventListener("submit", function(e){
    e.preventDefault();

    const formData = new FormData(this);

    fetch(API_URL, {
        method: "POST",
        body: formData
    })
    .then(res => res.text())
    .then(data => {
        document.getElementById("msg").innerHTML =
            "<span class='success'>✅ तक्रार यशस्वीपणे नोंद झाली</span>";
        this.reset();
        console.log(data);
    })
    .catch(err => {
        document.getElementById("msg").innerHTML =
            "<span class='error'>❌ तक्रार नोंद करताना अडचण आली</span>";
        console.error(err);
    });
});
</script>
